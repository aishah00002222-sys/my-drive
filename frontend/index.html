
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drive</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Authentication Section -->
    <section id="authSection">

        <h1>Welcome to My Drive</h1>

        <!-- Sign Up -->
        <form id="signupForm">
            <h2>Create Account</h2>

            <input
                type="email"
                id="signupEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Password (at least 6 characters)"
                minlength="6"
                required
            >

            <button type="submit">Sign Up</button>
        </form>

<button type="button" id="googleLoginButton">
    Sign in with Google
</button>


        <hr>

        <!-- Login -->
        <form id="loginForm">
            <h2>Login</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p id="authMessage"></p>

    </section>


    <!-- My Drive Application -->
    <div id="driveApp" hidden>

        <header>
            <h1>My Drive</h1>
            <input type="text" id="searchInput" placeholder="Search files and folders...">
            <button id="logoutButton">Logout</button>
        </header>

        <div class="container">

<aside>
    <h3>Menu</h3>

    <button id="myDriveButton" class="active">
        📁 My Drive
    </button>

    <button id="sharedButton">
        👥 Shared with me
    </button>

    <button id="recentButton">
        🕒 Recent
    </button>

    <button id="trashButton">
        🗑️ Trash
    </button>
</aside>


            <main>
    <h2>My Files</h2>
<button id="backButton" hidden>← Back</button>
    <div class="drive-actions">
        <button id="createFolderButton">
            + New Folder
        </button>
        <input type="file" id="fileInput">

<button id="uploadButton">Upload File</button>
    </div>

    <section>
        <h3>My Documents</h3>

        <div id="itemsList">
            <p>Loading your files...</p>
        </div>
    </section>
</main>

        </div>

    </div>

    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Application JavaScript -->
    <script src="script.js"></script>

</body>
</html>
